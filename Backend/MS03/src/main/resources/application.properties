spring.application.name=ms03-events
server.port=8083

# --- Eureka ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Transmet à Eureka le vrai statut de /health
eureka.client.healthcheck.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=ms03-events
info.app.version=1.0.0
info.app.description=Microservice de gestion des evenements solidaires
info.app.team=Five Core

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Base H2 (en memoire) ---
spring.datasource.url=jdbc:h2:mem:eventsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console




