spring.application.name=ms02-articles
server.port=8082

# --- Eureka ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Actuator / Swagger ---
#management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- Base H2 (en memoire) ---
spring.datasource.url=jdbc:h2:mem:articlesdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Actuator (atelier observabilité) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=ms02-articles
info.app.version=1.0.0
info.app.description=Microservice de gestion des articles et du blog
info.app.team=Five Core