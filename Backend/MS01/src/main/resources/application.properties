spring.application.name=ms01-offers
server.port=8082

# --- Eureka ---
eureka.client.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- Base MySQL (local) ---
spring.datasource.url=jdbc:mysql://localhost:3306/refood_offers?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=refood
spring.datasource.password=refood
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
