spring.application.name=ms04-donations
server.port=8084

# --- Eureka ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- Base MySQL (docker compose : service "mysql") ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/refood_donations
spring.datasource.username=${DB_USER:refood}
spring.datasource.password=${DB_PASSWORD:refood}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
